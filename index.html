<script>
const C=[
{t:"Chương I. Mở đầu",s:"Bài 1–3",m:"Vật lí nghiên cứu các dạng vận động của vật chất và năng lượng; mọi phép đo đều có sai số, cần ghi kết quả dạng Ā ± ΔA.",
k:["Phương pháp nghiên cứu: quan sát, đặt giả thuyết, thí nghiệm, kết luận.","Hệ đơn vị SI: m, kg, s, A, K, mol, cd.","Sai số hệ thống (do dụng cụ, cách đo) và sai số ngẫu nhiên (giảm bằng đo nhiều lần)."],
f:[["A = Ā ± ΔA","Ā: giá trị trung bình; ΔA = ΔĀ + ΔA’ (sai số tuyệt đối trung bình + sai số dụng cụ)"],["δA = ΔA/Ā · 100%","sai số tỉ đối, dùng để so sánh độ chính xác"]],
a:[["δ(x·y) = δ(x/y) = δx + δy","sai số tỉ đối của tích, thương bằng tổng"],["δ(xⁿ) = n·δx","dùng khi đo đại lượng bình phương, lập phương"]],
e:["Đo s = 1,00 ± 0,01 m và t = 2,0 ± 0,1 s. Tính v và sai số.","δs = 1%, δt = 5% ⇒ δv = 6%; v = 0,50 m/s ⇒ Δv = 0,03 m/s. Kết quả: v = 0,50 ± 0,03 m/s."],
l:"Đại lượng đo kém chính xác nhất quyết định sai số của kết quả."},
{t:"Chương II. Động học",s:"Bài 4–12",m:"Mô tả chuyển động bằng độ dịch chuyển, vận tốc, gia tốc; chuyển động thẳng biến đổi đều, rơi tự do và ném là các trường hợp gia tốc không đổi.",
k:["Độ dịch chuyển là đại lượng vectơ; quãng đường là đại lượng vô hướng.","Tốc độ = quãng đường/thời gian; vận tốc = độ dịch chuyển/thời gian.","Đồ thị d–t: độ dốc = vận tốc; đồ thị v–t: độ dốc = gia tốc, diện tích = độ dịch chuyển.","Rơi tự do: chỉ chịu trọng lực, g ≈ 9,8 m/s²."],
f:[["a = (v − v₀)/Δt","gia tốc"],["v = v₀ + at","vận tốc theo thời gian"],["d = v₀t + ½at²","độ dịch chuyển"],["v² − v₀² = 2ad","không chứa thời gian"],["Ném ngang: x = v₀t, y = ½gt²","L = v₀·√(2h/g)"]],
a:[["sₙ = v₀ + a(2n − 1)/2","quãng đường đi trong giây thứ n"],["Ném xiên: L = v₀² sin2α / g; H = v₀² sin²α / 2g","tầm xa lớn nhất khi α = 45°"],["Từ nghỉ: quãng đường các giây liên tiếp tỉ lệ 1 : 3 : 5 : …","hệ quả của d = ½at²"]],
e:["Xe tăng tốc từ nghỉ lên 20 m/s trong 10 s. Tính a và quãng đường.","a = 20/10 = 2 m/s²; d = ½·2·10² = 100 m. Kiểm tra: v² = 2ad = 400 ✔."],
l:"Mọi bài toán biến đổi đều quy về 3 phương trình: v, d và v²−v₀²."},
{t:"Chương III. Động lực học",s:"Bài 13–22",m:"Lực là nguyên nhân làm thay đổi chuyển động; ba định luật Newton cùng các lực thường gặp (trọng lực, căng, ma sát, cản, nâng) cho phép lập phương trình chuyển động.",
k:["Định luật 1: ΣF = 0 thì vật giữ nguyên trạng thái (quán tính).","Định luật 2: gia tốc cùng hướng với hợp lực, tỉ lệ thuận với lực, tỉ lệ nghịch với khối lượng.","Định luật 3: lực và phản lực cùng độ lớn, ngược chiều, đặt lên hai vật khác nhau.","Cân bằng của vật rắn: ΣF = 0 và ΣM = 0."],
f:[["F = ma","định luật 2 Newton"],["P = mg","trọng lực"],["F_ms = μN","ma sát trượt"],["M = F·d","moment lực (d: cánh tay đòn)"],["F² = F₁² + F₂² + 2F₁F₂cosα","tổng hợp hai lực"]],
a:[["Mặt phẳng nghiêng: a = g(sinα − μcosα)","vật trượt xuống; trượt đều khi tanα = μ"],["F_A = ρgV","lực nâng (đẩy Archimedes)"],["Quy tắc moment: Σ M(thuận) = Σ M(ngược)","chọn trục quay sao cho nhiều lực đi qua trục"]],
e:["Vật 2 kg chịu F = 10 N trên sàn có μ = 0,2 (g = 10 m/s²). Tính a.","N = mg = 20 N; F_ms = 0,2·20 = 4 N; a = (10 − 4)/2 = 3 m/s²."],
l:"Vẽ lực, chọn trục, viết ΣF = ma theo từng phương."},
{t:"Chương IV. Năng lượng, công, công suất",s:"Bài 23–27",m:"Năng lượng không tự sinh ra hay mất đi, chỉ chuyển hóa; công đo lượng năng lượng được truyền và cơ năng bảo toàn khi chỉ có lực thế.",
k:["Công của lực: A = F·d·cosθ (đơn vị J).","Công suất là tốc độ thực hiện công (W).","Động năng phụ thuộc khối lượng và tốc độ; thế năng trọng trường phụ thuộc độ cao.","Hiệu suất luôn nhỏ hơn 100%."],
f:[["A = F·d·cosθ","θ: góc giữa lực và độ dịch chuyển"],["P = A/t = F·v","công suất"],["W_đ = ½mv²;  W_t = mgh","động năng, thế năng"],["W = W_đ + W_t = hằng số","bảo toàn cơ năng"],["H = A_ích / A_tp · 100%","hiệu suất"]],
a:[["A = ΔW_đ = ½mv₂² − ½mv₁²","định lí động năng, áp dụng cả khi có ma sát"],["A_ms = ΔW (cơ năng)","độ biến thiên cơ năng bằng công lực không thế"]],
e:["Vật rơi tự do từ độ cao 20 m (g = 10 m/s²). Tính vận tốc chạm đất.","mgh = ½mv² ⇒ v = √(2gh) = √400 = 20 m/s."],
l:"Có thể dùng bảo toàn cơ năng thay cho động học khi không cần thời gian."},
{t:"Chương V. Động lượng",s:"Bài 28–30",m:"Động lượng của hệ kín được bảo toàn, nên phân tích va chạm mà không cần biết chi tiết lực tương tác.",
k:["Động lượng p = mv là đại lượng vectơ.","Xung lượng của lực bằng độ biến thiên động lượng.","Va chạm mềm: các vật dính nhau, động năng không bảo toàn.","Va chạm đàn hồi: bảo toàn cả động lượng và động năng."],
f:[["p = mv","động lượng (kg·m/s)"],["F·Δt = Δp","định luật 2 Newton dạng động lượng"],["m₁v₁ + m₂v₂ = m₁v₁’ + m₂v₂’","bảo toàn động lượng"]],
a:[["Va chạm mềm: v = (m₁v₁ + m₂v₂)/(m₁ + m₂)","phần động năng mất đi chuyển thành nhiệt, biến dạng"],["Đàn hồi xuyên tâm: v₁’ = [(m₁ − m₂)v₁ + 2m₂v₂]/(m₁ + m₂)","m₁ = m₂ thì hai vật đổi vận tốc cho nhau"]],
e:["Vật 2 kg chạy 3 m/s va chạm mềm vào vật 1 kg đứng yên. Tìm v sau va chạm.","v = (2·3)/(2+1) = 2 m/s."],
l:"Chọn chiều dương trước, viết động lượng theo dấu."},
{t:"Chương VI. Chuyển động tròn",s:"Bài 31–32",m:"Chuyển động tròn đều có tốc độ không đổi nhưng vận tốc đổi hướng nên luôn có gia tốc hướng tâm, do hợp lực hướng tâm gây ra.",
k:["Tốc độ góc ω = Δθ/Δt (rad/s); chu kì T, tần số f.","Tốc độ dài v = ωr.","Gia tốc hướng tâm hướng vào tâm quỹ đạo.","Lực hướng tâm là hợp lực, không phải một loại lực mới."],
f:[["ω = 2π/T = 2πf","tốc độ góc"],["v = ωr","liên hệ tốc độ dài và góc"],["a_ht = v²/r = ω²r","gia tốc hướng tâm"],["F_ht = mv²/r = mω²r","lực hướng tâm"]],
a:[["Qua cầu cong lồi: N = m(g − v²/r)","N = 0 khi v = √(gr)"],["Xe vào cua phẳng: v_max = √(μgr)","ma sát nghỉ đóng vai trò lực hướng tâm"]],
e:["Vật chuyển động tròn đều r = 0,5 m, T = 2 s. Tính ω, v, a_ht.","ω = π ≈ 3,14 rad/s; v = ωr ≈ 1,57 m/s; a_ht = ω²r ≈ 4,93 m/s²."],
l:"Hợp lực hướng vào tâm bằng mv²/r."},
{t:"Chương VII. Biến dạng của vật rắn, áp suất chất lỏng",s:"Bài 33–34",m:"Vật rắn biến dạng đàn hồi tuân theo định luật Hooke trong giới hạn đàn hồi; áp suất chất lỏng tăng theo độ sâu.",
k:["Biến dạng kéo, nén; giới hạn đàn hồi.","Khối lượng riêng ρ = m/V.","Áp suất tác dụng lên chất lỏng được truyền nguyên vẹn (Pascal)."],
f:[["F = k·|Δl|","định luật Hooke"],["ρ = m/V","khối lượng riêng"],["p = F/S","áp suất"],["p = p₀ + ρgh","áp suất ở độ sâu h"]],
a:[["σ = F/S;  ε = Δl/l₀;  E = σ/ε","ứng suất, biến dạng tỉ đối, mô-đun Young"],["k = E·S/l₀","độ cứng phụ thuộc vật liệu và kích thước"],["Máy nén thủy lực: F₂/F₁ = S₂/S₁","lợi về lực, không lợi về công"]],
e:["Áp suất do nước gây ra ở độ sâu 10 m (ρ = 1000 kg/m³, g = 10 m/s²)?","ρgh = 1000·10·10 = 10⁵ Pa; áp suất toàn phần ≈ 1,013·10⁵ + 10⁵ ≈ 2·10⁵ Pa."],
l:"Áp suất chất lỏng chỉ phụ thuộc độ sâu và khối lượng riêng."}];
const LG=['a: gia tốc (m/s²); v: vận tốc cuối (m/s); v₀: vận tốc đầu (m/s); Δt: khoảng thời gian (s).','v: vận tốc tại thời điểm t (m/s); v₀: vận tốc ban đầu (m/s); a: gia tốc (m/s²); t: thời gian (s).','d: độ dịch chuyển (m); v₀: vận tốc ban đầu (m/s); a: gia tốc (m/s²); t: thời gian (s).','v, v₀: vận tốc cuối và đầu (m/s); a: gia tốc (m/s²); d: độ dịch chuyển (m).','x: tọa độ ngang (m); y: độ rơi theo phương thẳng đứng (m); v₀: vận tốc ném (m/s); g: gia tốc rơi tự do (≈ 9,8 m/s²); h: độ cao ném (m); L: tầm xa (m).'];

C[1].svg="<div class='fig'><svg viewBox='0 0 300 160' role='img' aria-label='Đồ thị v–t'><g stroke='currentColor' fill='none'><path d='M40 135V15M40 135H285' stroke-width='1.5'/><polygon points='40,135 40,90 240,30 240,135' fill='#2563eb' fill-opacity='.18' stroke='none'/><path d='M40 90L240 30' stroke='#2563eb' stroke-width='2.5'/><path d='M240 30V135' stroke-dasharray='4'/></g><g fill='currentColor' font-size='12'><text x='22' y='20'>v</text><text x='280' y='152'>t</text><text x='20' y='94'>v₀</text><text x='244' y='28'>v</text><text x='232' y='150'>t</text><text x='95' y='118'>Diện tích = d</text><text x='120' y='52'>độ dốc = a</text></g></svg><svg viewBox='0 0 300 160' role='img' aria-label='Quỹ đạo ném xiên'><g stroke='currentColor' fill='none'><path d='M20 135H285' stroke-width='1.5'/><path d='M40 135Q160 -10 280 135' stroke='#b45309' stroke-width='2.5'/><path d='M160 135V63' stroke-dasharray='4'/><path d='M40 135L80 103' stroke-width='1.5'/></g><g fill='currentColor' font-size='12'><text x='160' y='56'>đỉnh</text><text x='166' y='105'>H</text><text x='150' y='152'>L</text><text x='58' y='128'>α</text><text x='84' y='100'>v₀</text></g></svg></div><p class='sub'>Trái: đồ thị v–t (độ dốc = a, diện tích dưới đồ thị = d). Phải: quỹ đạo ném xiên.</p>";
C[1].bt=[['Cơ bản','Xe chạy 72 km/h. Đổi ra m/s và tính quãng đường đi trong 30 s.','72 km/h = 72/3,6 = 20 m/s; d = vt = 20·30 = 600 m.'],['Cơ bản','Ô tô tăng tốc đều từ 5 m/s lên 15 m/s trong 5 s. Tính a và quãng đường.','a = (15 − 5)/5 = 2 m/s²; d = 5·5 + ½·2·25 = 50 m.'],['Cơ bản','Xe đang chạy 10 m/s hãm phanh với a = −2 m/s². Tính quãng đường và thời gian đến khi dừng.','v² − v₀² = 2ad ⇒ 0 − 100 = −4d ⇒ d = 25 m; t = (0 − 10)/(−2) = 5 s.'],['Cơ bản','Vật rơi tự do từ độ cao 45 m (g = 10 m/s²). Tính thời gian rơi và vận tốc chạm đất.','t = √(2h/g) = √9 = 3 s; v = gt = 30 m/s.'],['Nâng cao','Vật chuyển động nhanh dần đều từ nghỉ, trong giây thứ 3 đi được 5 m. Tìm a và quãng đường trong 10 s.','s₃ = a(2·3 − 1)/2 = 2,5a = 5 ⇒ a = 2 m/s²; d₁₀ = ½·2·10² = 100 m.'],['Nâng cao','Ném ngang từ độ cao 80 m với v₀ = 15 m/s (g = 10 m/s²). Tính tầm xa và tốc độ lúc chạm đất.','t = √(2·80/10) = 4 s; L = 15·4 = 60 m; v_y = gt = 40 m/s; v = √(15² + 40²) = √1825 ≈ 42,7 m/s.'],['Nâng cao','Ném xiên từ mặt đất với v₀ = 20 m/s, α = 30° (g = 10 m/s²). Tính thời gian bay, tầm xa và độ cao cực đại.','T = 2v₀sinα/g = 2 s; L = v₀²sin2α/g = 400·0,866/10 ≈ 34,6 m; H = v₀²sin²α/2g = 400·0,25/20 = 5 m.'],['Nâng cao','Xe A đứng yên cách xe B 50 m (B ở phía trước). Cùng lúc A khởi hành a = 1 m/s², B chạy đều 10 m/s cùng chiều. Khi nào A đuổi kịp B?','½t² = 10t + 50 ⇒ t² − 20t − 100 = 0 ⇒ t = 10 + 10√2 ≈ 24,1 s; vị trí gặp ≈ 291 m so với chỗ A xuất phát.']];

const L3=['F: hợp lực tác dụng lên vật (N); m: khối lượng (kg); a: gia tốc (m/s²).','P: trọng lực (N); m: khối lượng (kg); g: gia tốc rơi tự do (≈ 9,8 m/s²).','F_ms: lực ma sát trượt (N); μ: hệ số ma sát trượt (không có đơn vị); N: độ lớn phản lực vuông góc (N).','M: moment lực (N·m); F: độ lớn lực (N); d: cánh tay đòn, khoảng cách từ trục quay đến giá của lực (m).','F: độ lớn hợp lực (N); F₁, F₂: độ lớn hai lực thành phần (N); α: góc giữa hai lực.'];
C[2].f.forEach((x,i)=>x[2]=L3[i]);

C[2].a[1][2]='F_A: lực đẩy Archimedes (N); ρ: khối lượng riêng chất lỏng (kg/m³); g: gia tốc rơi tự do (m/s²); V: thể tích phần vật chìm (m³).';

C[2].svg="<div class='fig'><svg viewBox='0 0 300 160' role='img' aria-label='Các lực tác dụng lên vật trên mặt phẳng nghiêng'><g stroke='currentColor' fill='none' stroke-width='2'><path d='M30 135H270V45Z'/><path d='M150 82V125' stroke='#b45309'/><path d='M150 82L141 56' stroke='#2563eb'/><path d='M150 82L180 71' stroke='#16a34a'/><path d='M61 135A30 30 0 0 1 59 124'/></g><g fill='currentColor' font-size='12'><text x='126' y='52'>N</text><text x='155' y='132'>P = mg</text><text x='184' y='70'>F_ms</text><text x='66' y='128'>α</text></g></svg></div><p class='sub'>Vật trượt xuống mặt phẳng nghiêng: trọng lực P, phản lực N và ma sát F_ms (hướng lên dọc dốc).</p>";
C[2].bt=[['Cơ bản','Vật 5 kg chịu lực 20 N, bỏ qua ma sát. Tính gia tốc và vận tốc sau 3 s từ nghỉ.','a = F/m = 20/5 = 4 m/s²; v = at = 4·3 = 12 m/s.'],['Cơ bản','Vật 3 kg. Tính trọng lực trên Trái Đất (g = 10 m/s²) và trên Mặt Trăng (g = 1,6 m/s²).','P = mg = 3·10 = 30 N trên Trái Đất; P = 3·1,6 = 4,8 N trên Mặt Trăng.'],['Cơ bản','Vật 10 kg trượt trên sàn có μ = 0,3 (g = 10 m/s²). Tính lực ma sát và lực kéo ngang để vật chuyển động đều.','N = mg = 100 N; F_ms = μN = 0,3·100 = 30 N; chuyển động đều nên a = 0, F = F_ms = 30 N.'],['Cơ bản','Hai lực 3 N và 4 N vuông góc nhau. Tính độ lớn hợp lực; so sánh với khi cùng chiều và ngược chiều.','F = √(3² + 4²) = 5 N; cùng chiều: 3 + 4 = 7 N; ngược chiều: 4 − 3 = 1 N.'],['Nâng cao','Vật trượt từ nghỉ xuống dốc dài 5 m, nghiêng α = 30°, μ = 0,2 (g = 10 m/s²). Tính gia tốc và vận tốc ở chân dốc.','a = g(sinα − μcosα) = 10(0,5 − 0,2·0,866) ≈ 3,27 m/s²; v = √(2as) = √(2·3,27·5) ≈ 5,7 m/s.'],['Nâng cao','Thanh AB đồng chất dài 2 m, nặng 40 N, quay quanh bản lề A, nằm ngang nhờ dây thẳng đứng nối ở B. Treo vật 30 N cách A 1,5 m. Tính lực căng dây và phản lực thẳng đứng tại A.','Moment quanh A: T·2 = 40·1 + 30·1,5 = 85 ⇒ T = 42,5 N; cân bằng lực thẳng đứng: A_y + T = 40 + 30 ⇒ A_y = 70 − 42,5 = 27,5 N (hướng lên).'],['Nâng cao','Hai vật m₁ = 3 kg và m₂ = 2 kg nối bằng dây qua ròng rọc nhẹ (g = 10 m/s²). Tính gia tốc và lực căng dây.','a = (m₁ − m₂)g/(m₁ + m₂) = 10/5 = 2 m/s²; T = m₂(g + a) = 2·12 = 24 N (kiểm tra: m₁(g − a) = 3·8 = 24 N).'],['Nâng cao','Vật 5 kg trên sàn ngang, μ = 0,2, bị kéo bởi lực 20 N hợp với phương ngang góc 30° (g = 10 m/s²). Tính gia tốc.','N = mg − F·sin30° = 50 − 10 = 40 N; F_ms = 0,2·40 = 8 N; a = (F·cos30° − F_ms)/m = (17,32 − 8)/5 ≈ 1,86 m/s².']];
const fg=(b,t,c)=>`<div class='fig'><svg viewBox='0 0 300 160' role='img' aria-label='Hình minh họa'><g stroke='currentColor' fill='none' stroke-width='2'>${b}</g><g fill='currentColor' font-size='12'>${t}</g></svg></div><p class='sub'>${c}</p>`;
const lg=(i,F,A)=>{F.forEach((s,j)=>C[i].f[j][2]=s);A.forEach((s,j)=>C[i].a[j][2]=s)};

C[0].bt=[[cb,'Đo chiều dài 5 lần: 10,2; 10,4; 10,3; 10,1; 10,5 cm. Tính giá trị trung bình và sai số tuyệt đối trung bình.','Ā = 51,5/5 = 10,3 cm; các |ΔA| = 0,1; 0,1; 0; 0,2; 0,2; ΔĀ = 0,6/5 = 0,12 cm.'],[cb,'Chiều dài đo được là 20,0 ± 0,2 cm. Tính sai số tỉ đối.','δ = 0,2/20,0 · 100% = 1%.'],[cb,'Đổi 36 km/h và 2,5 g/cm³ sang đơn vị SI.','36 km/h = 36/3,6 = 10 m/s; 2,5 g/cm³ = 2,5·10³ kg/m³ = 2500 kg/m³.'],[cb,'Cân luôn chỉ lệch 0,2 g khi chưa đặt vật. Đây là loại sai số nào và khắc phục thế nào?','Sai số hệ thống (sai số không của dụng cụ); hiệu chỉnh: trừ 0,2 g khỏi mọi kết quả đo hoặc chỉnh lại số 0.'],[na,'Cạnh hình lập phương a = 5,00 ± 0,05 cm. Tính thể tích và sai số.','δa = 1% ⇒ δV = 3δa = 3%; V = 125 cm³; ΔV = 3%·125 ≈ 4 cm³; V = 125 ± 4 cm³.'],[na,'Đo g bằng con lắc: g = 4π²ℓ/T², ℓ = 1,000 ± 0,002 m, T = 2,010 ± 0,010 s. Tính g và sai số.','g = 4π²·1,000/2,010² ≈ 9,77 m/s²; δg = δℓ + 2δT = 0,2% + 2·0,50% ≈ 1,2%; Δg ≈ 0,12; g = 9,77 ± 0,12 m/s².'],[na,'Đo U = 12,0 ± 0,1 V và I = 0,50 ± 0,01 A. Tính R = U/I và sai số.','R = 12,0/0,50 = 24,0 Ω; δR = δU + δI = 0,83% + 2% ≈ 2,8%; ΔR ≈ 0,7 Ω; R = 24,0 ± 0,7 Ω.'],[na,'Thả vật rơi từ h = 1,20 ± 0,01 m, đo t = 0,50 ± 0,01 s. Tính g = 2h/t² và sai số.','g = 2·1,20/0,25 = 9,6 m/s²; δg = δh + 2δt = 0,83% + 4% ≈ 4,8%; Δg ≈ 0,5; g = 9,6 ± 0,5 m/s².']];
lg(3,['A: công (J); F: độ lớn lực (N); d: độ dịch chuyển (m); θ: góc giữa lực và hướng dịch chuyển.','P: công suất (W); A: công (J); t: thời gian (s); F: lực (N); v: vận tốc (m/s) khi lực không đổi, cùng hướng.','W_đ: động năng (J); m: khối lượng (kg); v: tốc độ (m/s); W_t: thế năng (J); g: 9,8 m/s²; h: độ cao so với mốc (m).','W: cơ năng (J); bảo toàn khi không có ma sát và lực cản.','H: hiệu suất; A_ích: công có ích (J); A_tp: công toàn phần (J).'],['A: công của hợp lực (J); v₁, v₂: tốc độ đầu và cuối (m/s); m: khối lượng (kg).','A_ms: công của lực không thế như ma sát, cản (J); ΔW: độ biến thiên cơ năng (J).']);

C[3].bt=[[cb,'Lực 50 N kéo vật đi 4 m, hợp với hướng dịch chuyển góc 60°. Tính công.','A = F·d·cosθ = 50·4·cos60°; A = 100 J.'],[cb,'Động cơ nâng vật 200 kg lên cao 10 m trong 20 s (g = 10 m/s²). Tính công và công suất.','A = mgh = 200·10·10 = 20000 J; P = A/t = 20000/20 = 1000 W.'],[cb,'Xe 1000 kg chạy 20 m/s. Tính động năng.','W_đ = ½mv² = ½·1000·20² = 2·10⁵ J.'],[cb,'Máy có hiệu suất 80%, công toàn phần 500 J. Tính công có ích.','A_ích = H·A_tp = 0,8·500 = 400 J.'],[na,'Vật 2 kg thả từ độ cao 5 m, chạm đất với tốc độ 8 m/s (g = 10 m/s²). Tính công của lực cản.','A_trọng lực = mgh = 100 J; ΔW_đ = ½·2·64 = 64 J; A_cản = 64 − 100 = −36 J (lực cản sinh công âm 36 J).'],[na,'Xe 1000 kg đang chạy 20 m/s hãm phanh, dừng sau 40 m. Tính lực hãm trung bình.','A = 0 − ½mv² = −2·10⁵ J; −F·d = −2·10⁵; F = 2·10⁵/40 = 5000 N.'],[na,'Con lắc dài 1 m thả không vận tốc đầu từ góc 60° (g = 10 m/s²). Tính tốc độ ở vị trí thấp nhất.','h = ℓ(1 − cos60°) = 0,5 m; mgh = ½mv²; v = √(2gh) = √10 ≈ 3,16 m/s.'],[na,'Ô tô 1,5 tấn lên dốc nghiêng 10° với tốc độ đều 18 km/h, lực cản 500 N (g = 10 m/s²). Tính công suất động cơ.','v = 18/3,6 = 5 m/s; F = mg·sin10° + F_cản ≈ 15000·0,1736 + 500 ≈ 3105 N; P = Fv ≈ 15,5 kW.']];

C[4].bt=[[cb,'Xe 1200 kg chạy 15 m/s. Tính động lượng.','p = mv = 1200·15 = 18000 kg·m/s.'],[cb,'Bóng 0,4 kg bay 10 m/s đập vào tường, bật ngược lại 10 m/s, thời gian va chạm 0,02 s. Tính lực trung bình.','Chọn chiều dương là chiều bay tới: Δp = 0,4(−10) − 0,4(10) = −8 kg·m/s; F = Δp/Δt = −400 N; độ lớn 400 N.'],[cb,'Vật 3 kg chạy 2 m/s va chạm mềm vào vật 1 kg đứng yên. Tính tốc độ sau va chạm.','v = (3·2 + 0)/(3 + 1) = 1,5 m/s.'],[cb,'Súng 4 kg bắn đạn 20 g với tốc độ 500 m/s. Tính vận tốc giật lùi của súng.','Tổng động lượng ban đầu bằng 0: 4V + 0,02·500 = 0; V = −2,5 m/s (ngược hướng đạn, độ lớn 2,5 m/s).'],[na,'Ở bài 3, tính phần động năng bị mất.','Trước: ½·3·2² = 6 J; sau: ½·4·1,5² = 4,5 J; mất 1,5 J.'],[na,'Xe 2 kg chạy 4 m/s va chạm mềm với xe 3 kg chạy ngược chiều 1 m/s. Tìm vận tốc sau va chạm.','Chọn chiều dương theo xe 1: 2·4 + 3·(−1) = 5; v = 5/5 = 1 m/s; cùng chiều chuyển động ban đầu của xe 1.'],[na,'Vật 1 kg chạy 6 m/s va chạm đàn hồi xuyên tâm với vật 2 kg đứng yên. Tìm vận tốc hai vật sau va chạm.','v₁’ = (1 − 2)·6/3 = −2 m/s; v₂’ = 2·1·6/3 = 4 m/s; kiểm tra: 6 = 1·(−2) + 2·4.'],[na,'Đạn 10 g bay 400 m/s cắm vào khối gỗ 1,99 kg treo bằng dây dài. Tính vận tốc hệ ngay sau va chạm và độ cao tối đa (g = 10 m/s²).','v = 0,01·400/2,00 = 2 m/s; ½v² = gh ⇒ h = 4/20 = 0,2 m.']];
lg(5,['ω: tốc độ góc (rad/s); T: chu kì (s); f: tần số (Hz).','v: tốc độ dài (m/s); ω: tốc độ góc (rad/s); r: bán kính quỹ đạo (m).','a_ht: gia tốc hướng tâm (m/s²); v: tốc độ dài (m/s); ω: tốc độ góc (rad/s); r: bán kính (m).','F_ht: hợp lực hướng tâm (N); m: khối lượng (kg); v, ω, r như trên.'],['N: áp lực của cầu lên xe (N); m: khối lượng xe (kg); g: 9,8 m/s²; v: tốc độ (m/s); r: bán kính cong (m).','v_max: tốc độ lớn nhất không trượt (m/s); μ: hệ số ma sát nghỉ; g (m/s²); r: bán kính khúc cua (m).']);

C[5].bt=[[cb,'Bánh xe quay 120 vòng/phút. Tính f, T và ω.','f = 120/60 = 2 Hz; T = 1/f = 0,5 s; ω = 2πf = 4π ≈ 12,6 rad/s.'],[cb,'Điểm cách trục quay 0,2 m với ω = 10 rad/s. Tính v và a_ht.','v = ωr = 10·0,2 = 2 m/s; a_ht = ω²r = 100·0,2 = 20 m/s².'],[cb,'Vật 0,5 kg buộc vào dây dài 0,4 m quay tròn đều với tốc độ 4 m/s. Tính lực căng dây.','Lực căng đóng vai trò lực hướng tâm; F = mv²/r = 0,5·16/0,4 = 20 N.'],[cb,'Kim phút dài 10 cm. Tính ω và tốc độ dài của đầu kim.','T = 3600 s; ω = 2π/3600 ≈ 1,75·10⁻³ rad/s; v = ωr ≈ 1,75·10⁻⁴ m/s.'],[na,'Xe 1000 kg qua điểm cao nhất của cầu cong lồi bán kính 50 m với v = 10 m/s (g = 10 m/s²). Tính áp lực lên cầu.','N = m(g − v²/r) = 1000(10 − 100/50); N = 8000 N.'],[na,'Cầu cong lồi bán kính 40 m. Xe phải chạy nhanh bao nhiêu để áp lực lên cầu bằng 0 ở đỉnh (g = 10 m/s²)?','N = 0 ⇒ g = v²/r; v = √(gr) = √400 = 20 m/s.'],[na,'Xe vào khúc cua phẳng bán kính 50 m, μ = 0,4 (g = 10 m/s²). Tính tốc độ tối đa.','Ma sát nghỉ cực đại là lực hướng tâm: μmg = mv²/r; v = √(μgr) = √200 ≈ 14,1 m/s ≈ 51 km/h.'],[na,'Con lắc nón: vật 0,2 kg, dây dài 1 m, dây hợp thẳng đứng góc 30° (g = 10 m/s²). Tính ω và lực căng dây.','T·cosα = mg và T·sinα = mω²·ℓ·sinα; ω² = g/(ℓcosα) = 11,55 ⇒ ω ≈ 3,40 rad/s; T = mg/cosα = 2/0,866 ≈ 2,31 N.']];
lg(6,['F: lực đàn hồi (N); k: độ cứng (N/m); |Δl|: độ biến dạng (m).','ρ: khối lượng riêng (kg/m³); m: khối lượng (kg); V: thể tích (m³).','p: áp suất (Pa = N/m²); F: áp lực vuông góc (N); S: diện tích bị ép (m²).','p: áp suất ở độ sâu h (Pa); p₀: áp suất khí quyển (≈ 1,013·10⁵ Pa); ρ: khối lượng riêng chất lỏng (kg/m³); g (m/s²); h: độ sâu (m).'],['σ: ứng suất (Pa); F: lực kéo (N); S: tiết diện (m²); ε: biến dạng tỉ đối; Δl: độ dãn (m); l₀: chiều dài ban đầu (m); E: mô-đun Young (Pa).','k: độ cứng (N/m); E: mô-đun Young (Pa); S: tiết diện (m²); l₀: chiều dài ban đầu (m).','F₁, F₂: lực lên pit-tông nhỏ và lớn (N); S₁, S₂: diện tích tương ứng (m²).']);
C[6].svg=fg(`<path d='M100 20V135H200V20'/><path d='M100 50H200' stroke-dasharray='4'/><path d='M230 50V120M225 56l5-6 5 6M225 114l5 6 5-6'/>`,`<text x='106' y='44'>mặt thoáng (p₀)</text><text x='238' y='90'>h</text><text x='108' y='128'>p = p₀ + ρgh</text>`,'Áp suất chất lỏng tăng tuyến tính theo độ sâu h.');
C[6].bt=[[cb,'Lò xo k = 100 N/m treo vật 0,5 kg (g = 10 m/s²). Tính độ dãn.','F = P = 5 N; Δl = F/k = 5/100 = 0,05 m = 5 cm.'],[cb,'Khối sắt 2 kg có thể tích 0,25 dm³. Tính khối lượng riêng.','V = 0,25·10⁻³ = 2,5·10⁻⁴ m³; ρ = m/V = 8000 kg/m³.'],[cb,'Vật nặng 60 N đặt trên mặt có diện tích tiếp xúc 0,03 m². Tính áp suất.','p = F/S = 60/0,03 = 2000 Pa.'],[cb,'Tính áp suất do nước gây ra ở độ sâu 5 m và áp suất toàn phần (ρ = 1000 kg/m³, g = 10 m/s²).','ρgh = 1000·10·5 = 5·10⁴ Pa; p = p₀ + ρgh ≈ 1,013·10⁵ + 0,5·10⁵ ≈ 1,5·10⁵ Pa.'],[na,'Dây thép dài 2 m, tiết diện 1 mm², E = 2·10¹¹ Pa, kéo bằng lực 200 N. Tính độ dãn.','σ = F/S = 200/10⁻⁶ = 2·10⁸ Pa; ε = σ/E = 10⁻³; Δl = ε·l₀ = 2·10⁻³ m = 2 mm.'],[na,'Lò xo độ cứng 100 N/m được cắt làm đôi. Độ cứng mỗi nửa là bao nhiêu?','k = ES/l₀ nên k tỉ lệ nghịch với l₀; l₀ giảm một nửa ⇒ k’ = 2k = 200 N/m.'],[na,'Máy nén thủy lực S₁ = 10 cm², S₂ = 200 cm²; đẩy pit-tông nhỏ bằng lực 50 N. Tính lực ở pit-tông lớn và quãng đường pit-tông nhỏ phải đi để pit-tông lớn nâng 1 cm.','F₂ = F₁·S₂/S₁ = 50·20 = 1000 N; thể tích chất lỏng không đổi: S₁·x = S₂·1 cm ⇒ x = 20 cm.'],[na,'Ống chữ U chứa nước (1000 kg/m³) và dầu (800 kg/m³). Cột dầu cao 25 cm tính từ mặt phân cách. Tính chiều cao cột nước tính từ mặt phân cách.','Cùng mức mặt phân cách áp suất bằng nhau: ρ_nước·h_nước = ρ_dầu·h_dầu; h_nước = 800·25/1000 = 20 cm.']];
const LS=[[
['Bài 1. Làm quen với Vật lí',['Đối tượng nghiên cứu: các dạng vận động của vật chất và năng lượng.','Phương pháp: quan sát, đặt giả thuyết, thí nghiệm, kiểm tra, kết luận.','Hệ SI: m, kg, s, A, K, mol, cd.'],[]],
['Bài 2. Các quy tắc an toàn trong phòng thực hành Vật lí',['Đọc kĩ hướng dẫn, kiểm tra thiết bị trước khi dùng.','Chú ý ký hiệu cảnh báo: điện, nhiệt, hóa chất, tia laser.','Có sự cố: ngắt nguồn điện, báo ngay giáo viên.'],[]],
['Bài 3. Thực hành tính sai số trong phép đo. Ghi kết quả đo',['Sai số hệ thống và sai số ngẫu nhiên.','Sai số tuyệt đối, sai số tỉ đối; ghi kết quả dạng Ā ± ΔA.'],[['A = Ā ± ΔA','ΔA = ΔĀ + ΔA’ (sai số ngẫu nhiên + sai số dụng cụ)'],['δA = ΔA/Ā · 100%','sai số tỉ đối']]]],
[
['Bài 4. Độ dịch chuyển và quãng đường đi được',['Độ dịch chuyển là vectơ nối vị trí đầu và cuối; quãng đường là độ dài đường đi (vô hướng).','Chuyển động thẳng không đổi chiều: độ lớn độ dịch chuyển bằng quãng đường.'],[['d = x₂ − x₁','x₁, x₂: tọa độ đầu, cuối trên trục Ox (m)']]],
['Bài 5. Tốc độ và vận tốc',['Tốc độ trung bình = quãng đường / thời gian (vô hướng).','Vận tốc trung bình = độ dịch chuyển / thời gian (vectơ).'],[['v_tb = s/t','s: quãng đường (m); t: thời gian (s)'],['v = d/Δt','d: độ dịch chuyển (m); Δt: khoảng thời gian (s)']]],
['Bài 6. Thực hành: Đo tốc độ của vật chuyển động',['Dùng đồng hồ đo thời gian hiện số và cổng quang điện.','Đo nhiều lần, lấy giá trị trung bình, tính sai số.'],[['v = s/t','s: khoảng cách giữa hai cổng quang; t: thời gian đo']]],
['Bài 7. Đồ thị độ dịch chuyển – thời gian',['Chuyển động thẳng đều: đồ thị d–t là đường thẳng.','Độ dốc đồ thị bằng vận tốc; đường nằm ngang là vật đứng yên.'],[['v = Δd/Δt','độ dốc của đồ thị d–t']]],
['Bài 8. Chuyển động biến đổi. Gia tốc',['Gia tốc cho biết vận tốc biến đổi nhanh hay chậm.','Nhanh dần: a cùng chiều v; chậm dần: a ngược chiều v.'],[['a = (v − v₀)/Δt','đơn vị m/s²']]],
['Bài 9. Chuyển động thẳng biến đổi đều',['Gia tốc không đổi.','Đồ thị v–t là đường thẳng; diện tích dưới đồ thị bằng độ dịch chuyển.'],[['v = v₀ + at',''],['d = v₀t + ½at²',''],['v² − v₀² = 2ad','không chứa thời gian']]],
['Bài 10. Sự rơi tự do',['Rơi tự do: chỉ chịu tác dụng của trọng lực, bắt đầu từ trạng thái nghỉ.','Gia tốc rơi tự do g ≈ 9,8 m/s², mọi vật rơi như nhau khi bỏ qua lực cản.'],[['v = gt','vận tốc sau thời gian t'],['h = ½gt²','quãng đường rơi'],['v² = 2gh','liên hệ vận tốc và độ cao']]],
['Bài 11. Thực hành: Đo gia tốc rơi tự do',['Thả vật qua cổng quang, đo thời gian rơi ứng với các độ cao khác nhau.','Tính g từ nhiều lần đo, ghi kết quả kèm sai số.'],[['g = 2h/t²','h: độ cao rơi (m); t: thời gian rơi (s)']]],
['Bài 12. Chuyển động ném',['Chuyển động ném phân tích thành hai chuyển động thành phần theo phương ngang (đều) và thẳng đứng (biến đổi đều).','Ném ngang và ném xiên.'],[['x = v₀t;  y = ½gt²','ném ngang'],['L = v₀√(2h/g)','tầm xa ném ngang'],['L = v₀² sin2α / g;  H = v₀² sin²α / 2g','ném xiên từ mặt đất']]]],
[
['Bài 13. Tổng hợp và phân tích lực. Cân bằng lực',['Tổng hợp lực theo quy tắc hình bình hành; phân tích lực là thay một lực bằng hai lực thành phần.','Chất điểm cân bằng khi hợp lực bằng 0.'],[['F = F₁ + F₂','phép cộng vectơ'],['F² = F₁² + F₂² + 2F₁F₂cosα','α: góc giữa hai lực'],['ΣF = 0','điều kiện cân bằng']]],
['Bài 14. Định luật 1 Newton',['Vật không chịu lực hoặc hợp lực bằng 0 thì giữ nguyên trạng thái đứng yên hoặc chuyển động thẳng đều.','Quán tính là tính chất giữ nguyên trạng thái chuyển động.'],[['ΣF = 0 ⇒ a = 0','']]],
['Bài 15. Định luật 2 Newton',['Gia tốc cùng hướng với hợp lực, tỉ lệ thuận với lực, tỉ lệ nghịch với khối lượng.','Khối lượng đặc trưng cho mức quán tính.'],[['F = ma','F: hợp lực (N); m: khối lượng (kg); a: gia tốc (m/s²)']]],
['Bài 16. Định luật 3 Newton',['Lực và phản lực cùng độ lớn, ngược chiều, đặt lên hai vật khác nhau, xuất hiện đồng thời.'],[['F₁₂ = −F₂₁','lực của vật 1 lên 2 và của vật 2 lên 1']]],
['Bài 17. Trọng lực và lực căng',['Trọng lực là lực hút của Trái Đất, đặt tại trọng tâm, hướng xuống.','Lực căng xuất hiện ở dây bị kéo căng, hướng dọc theo dây.'],[['P = mg','g ≈ 9,8 m/s²']]],
['Bài 18. Lực ma sát',['Có ma sát nghỉ, ma sát trượt, ma sát lăn.','Ma sát trượt phụ thuộc vào áp lực và tính chất bề mặt, không phụ thuộc diện tích tiếp xúc.'],[['F_ms = μN','μ: hệ số ma sát trượt; N: phản lực vuông góc'],['F_msn(max) = μ_n·N','ma sát nghỉ cực đại']]],
['Bài 19. Lực cản và lực nâng',['Vật chuyển động trong chất lưu chịu lực cản, tăng theo tốc độ và diện tích cản.','Lực nâng (đẩy Archimedes) hướng lên, có độ lớn bằng trọng lượng chất lưu bị chiếm chỗ.'],[['F_A = ρgV','ρ: khối lượng riêng chất lỏng; V: thể tích phần chìm']]],
['Bài 20. Một số ví dụ về cách giải bài toán động lực học',['Các bước: vẽ lực, chọn hệ trục, viết ΣF = ma cho từng trục, giải hệ.','Mặt phẳng nghiêng: phân tích trọng lực theo hai phương song song và vuông góc.'],[['N = mg·cosα','phản lực trên mặt phẳng nghiêng'],['a = g(sinα − μcosα)','trượt xuống dốc']]],
['Bài 21. Moment lực. Cân bằng của vật rắn',['Moment lực đặc trưng cho tác dụng làm quay.','Vật rắn cân bằng khi tổng lực bằng 0 và tổng moment (quanh một trục bất kì) bằng 0.'],[['M = F·d','d: cánh tay đòn (m); đơn vị N·m'],['ΣM(thuận) = ΣM(ngược)','quy tắc moment']]],
['Bài 22. Thực hành: Tổng hợp lực',['Dùng hai lực kế kéo vòng dây, so sánh hợp lực đo được với hợp lực tính bằng quy tắc hình bình hành.'],[['F² = F₁² + F₂² + 2F₁F₂cosα','F tính được so với F đo']]]],
[
['Bài 23. Năng lượng. Công cơ học',['Năng lượng có nhiều dạng, chuyển hóa từ dạng này sang dạng khác và bảo toàn.','Công là số đo năng lượng truyền đi khi lực làm vật dịch chuyển.'],[['A = F·d·cosθ','θ: góc giữa lực và độ dịch chuyển'],['1 J = 1 N·m','đơn vị công']]],
['Bài 24. Công suất',['Công suất là tốc độ thực hiện công.'],[['P = A/t','1 W = 1 J/s'],['P = F·v','lực không đổi cùng hướng chuyển động']]],
['Bài 25. Động năng, thế năng',['Động năng là năng lượng do chuyển động; thế năng trọng trường phụ thuộc độ cao so với mốc.','Định lí động năng: công của hợp lực bằng độ biến thiên động năng.'],[['W_đ = ½mv²',''],['W_t = mgh','h: độ cao so với mốc thế năng']]],
['Bài 26. Cơ năng và định luật bảo toàn cơ năng',['Cơ năng = động năng + thế năng.','Khi chỉ có lực thế (trọng lực) thì cơ năng bảo toàn.'],[['W = W_đ + W_t = hằng số','không có ma sát, lực cản']]],
['Bài 27. Hiệu suất',['Hiệu suất cho biết tỉ lệ năng lượng có ích trên năng lượng toàn phần; luôn nhỏ hơn 100%.'],[['H = A_ích / A_tp · 100%',''],['H = P_ích / P_tp · 100%','tính theo công suất']]]],
[

const lsn=i=>`<section class="box" id="l"><h2>Nội dung từng bài</h2>${LS[i].map(l=>`<details class="d lsn"><summary>${l[0]}</summary>${l[1].length?`<ul>${l[1].map(k=>`<li>${k}</li>`).join("")}</ul>`:""}${l[2].map(x=>`<div class="f lf"><b>${x[0]}</b><small>${x[1]}</small></div>`).join("")}${l[2].length?"":`<p class="sub">Bài này không có công thức mới.</p>`}</details>`).join("")}</section>`;
const S=["mo-dau","dong-hoc","dong-luc-hoc","nang-luong","dong-luong","chuyen-dong-tron","bien-dang"];
const $=s=>document.querySelector(s),M=$("#main"),R=document.documentElement;
R.dataset.theme=matchMedia("(prefers-color-scheme:light)").matches?"light":"dark";
$("#tb").onclick=()=>{R.dataset.theme=R.dataset.theme=="dark"?"light":"dark"};
const nm=c=>c.t.split(". ");
function home(){document.title="Vật lí 10 – Đẳng Cấp Nhất Thế Giới";
M.innerHTML=`<section class="hero"><h1>Vật lí <span>10</span></h1><p>Tóm tắt 7 chương: công thức có giải thích ký hiệu, hình minh họa và bài tập từ cơ bản đến nâng cao.</p></section><ul class="grid" id="gr"></ul><p class="sub" id="em" hidden>Không tìm thấy.</p>`;cards()}
function cards(){const q=$("#q").value.trim().toLowerCase();
const L=C.map((c,i)=>[c,i]).filter(([c])=>!q||JSON.stringify(c).toLowerCase().includes(q));
$("#gr").innerHTML=L.map(([c,i])=>`<li><a class="card" href="#${S[i]}"><div class="top"><span class="badge">${c.s}</span><span class="tag ${c.bt?"ok":""}">${c.bt?"Đầy đủ":"Tóm tắt"}</span></div><h3>${nm(c)[1]}</h3><div class="sub">${nm(c)[0]}</div></a></li>`).join("");$("#em").hidden=L.length>0}
const fm=(x,a)=>`<div class="f ${a?"adv":"base"}"><b>${x[0]}</b><small>${x[1]}</small>${x[2]?`<div class="sym">${x[2]}</div>`:""}</div>`;
const ex=(b,j)=>{const st=b[2].split("; "),h=b[0]=="Nâng cao";return `<div class="ex ${h?"hard":""}"><div><span class="lv">${b[0]}</span><b>Bài ${j+1}</b></div><p>${b[1]}</p><button class="btn sb">Xem lời giải</button><div class="sol" hidden><ol>${st.map(s=>`<li>${s}</li>`).join("")}</ol></div></div>`};
function chap(i){const c=C[i];document.title=c.t+" – Vật lí 10";
const T=[["y","Ý chính"],["l","Từng bài"],["f","Công thức"],["v","Ví dụ"]];if(c.bt)T.push(["b","Bài tập"]);
M.innerHTML=`<div class="lay"><nav class="toc"><h2>Mục lục</h2><ol>${T.map(t=>`<li><button data-t="${t[0]}">${t[1]}</button></li>`).join("")}</ol></nav><article><a class="crumb" href="#">← Tất cả chương</a><h1>${c.t}</h1><div class="sub">${c.s}</div>
<div class="chips"><button class="chip on" data-m="all">Tất cả</button><button class="chip" data-m="base">Công thức sách</button><button class="chip" data-m="adv">Nâng cao</button></div>
<section class="box" id="y"><h2>Ý chính</h2><p>${c.m}</p><ul>${c.k.map(k=>`<li>${k}</li>`).join("")}</ul></section>
${lsn(i)}<section class="box" id="f"><h2>Công thức</h2>${c.f.map(x=>fm(x,0)).join("")}${c.a.map(x=>fm(x,1)).join("")}${c.svg||""}</section>
<section class="box" id="v"><h2>Ví dụ</h2><details class="d"><summary>${c.e[0]}</summary><p>${c.e[1]}</p></details><p class="one">Tóm lại: ${c.l}</p></section>
${c.bt?`<section id="b"><h2>Bài tập</h2>${c.bt.map(ex).join("")}</section>`:`<p class="box sub">Bài tập cho chương này đang được bổ sung.</p>`}
<nav class="pager">${i>0?`<a class="btn" href="#${S[i-1]}">← ${nm(C[i-1])[0]}</a>`:"<span></span>"}${i<6?`<a class="btn" href="#${S[i+1]}">${nm(C[i+1])[0]} →</a>`:"<span></span>"}</nav></article></div>`;
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>$("#"+b.dataset.t).scrollIntoView());
document.querySelectorAll(".sb").forEach(b=>b.onclick=()=>{const s=b.nextElementSibling;s.hidden=!s.hidden;b.textContent=s.hidden?"Xem lời giải":"Ẩn lời giải"});
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const m=b.dataset.m;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x==b));document.querySelectorAll(".f").forEach(f=>f.hidden=(m=="base"&&f.classList.contains("adv"))||(m=="adv"&&f.classList.contains("base")))})}
function route(){const i=S.indexOf(location.hash.slice(1));i>=0?chap(i):home();scrollTo(0,0)}
addEventListener("hashchange",route);
$("#q").oninput=()=>{if($("#gr"))cards();else location.hash=""};
route();
</script></body></html>
